<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360">

  <style>
    .bg {
      fill: #0d1117;
    }

    .title {
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      fill: #ffffff;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #8b949e;
    }

    .month {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #8b949e;
    }

    .grid {
      stroke: #30363d;
      stroke-width: 1;
      opacity: 0.7;
    }

    .area {
      fill: #238636;
      opacity: 0.25;
    }

    .line {
      fill: none;
      stroke: #39d353;
      stroke-width: 3;
    }

    .point {
      fill: #39d353;
    }

    .peak {
      fill: #00e5ff;
      stroke: #ffffff;
      stroke-width: 2;
    }
  </style>

  <!-- Background -->
  <rect
    class="bg"
    x="0"
    y="0"
    width="1200"
    height="360"
    rx="14"
  />

  <!-- Heading -->
  <text
    x="40"
    y="42"
    class="title">
    Contribution Activity Graph
  </text>

  <!-- Subtitle -->
  <text
    x="40"
    y="68"
    class="subtitle">
    GitHub contribution activity
  </text>

  <!-- Statistics -->
  <text
    x="850"
    y="42"
    class="subtitle">
    Total Contributions
  </text>

  <text
    x="850"
    y="65"
    class="subtitle">
    Updated automatically
  </text>

  <!-- Horizontal grid -->
  <line x1="80" y1="100" x2="1160" y2="100" class="grid"/>
  <line x1="80" y1="134" x2="1160" y2="134" class="grid"/>
  <line x1="80" y1="168" x2="1160" y2="168" class="grid"/>
  <line x1="80" y1="202" x2="1160" y2="202" class="grid"/>
  <line x1="80" y1="236" x2="1160" y2="236" class="grid"/>
  <line x1="80" y1="270" x2="1160" y2="270" class="grid"/>

  <!-- Vertical grid -->
