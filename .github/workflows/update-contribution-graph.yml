name: Update Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-graph:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          GITHUB_USERNAME: hema-sree-04

        run: |
          python scripts/generate_contribution_graph.py

      - name: Commit updated graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          git diff --cached --quiet || \
          git commit -m "chore: update contribution graph"

          git push
